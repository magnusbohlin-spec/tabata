<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jag &amp; Kroppen">
<meta name="theme-color" content="#050C22">
<title>Jag &amp; Kroppen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050C22; --card:#0B1636; --card2:#141F45;
  --line:rgba(242,238,233,.08); --line2:rgba(242,238,233,.17);
  --ink:#F2EEE9; --dim:#A08D82; --dimmer:#6F625B;
  --pump:#FE8A24; --navy:#021D6B;
  --f:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--f);font-size:15px;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;color:inherit;background:none;border:none;font-size:inherit}
button{cursor:pointer}
.screen{flex:1;display:none;flex-direction:column;min-height:0;background:var(--bg);color:var(--ink)}
.screen.on{display:flex}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:500}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}

.mast{padding:26px 18px 15px;flex:none}
.mast h1{font-size:29px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.05}
.mast .sport{margin-top:9px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--pump);font-weight:600;display:flex;align-items:center;gap:9px}
.mast .sport::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(254,138,36,.45),transparent)}

.week{display:flex;gap:5px;padding:0 18px 18px;border-bottom:1px solid var(--line);flex:none;align-items:flex-end}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.wl{font-size:9px;letter-spacing:.1em;color:var(--dimmer);text-transform:uppercase}
.wc{width:100%;height:30px;border-radius:5px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--dimmer)}
.wd.on .wc{background:rgba(254,138,36,.18);border-color:rgba(254,138,36,.55);color:var(--pump)}
.wd.today .wc{border-color:var(--line2)}
.wd.today.on .wc{border-color:var(--pump)}

.pad{padding:20px 18px 40px}
.sec{margin-bottom:26px}
.sec>.lbl{display:block;margin-bottom:11px}
.intro{font-size:12.5px;color:var(--dim);line-height:1.6;margin:0 0 13px}

.big{width:100%;background:var(--pump);color:#1A0E00;font-weight:600;font-size:15px;
  letter-spacing:.02em;padding:17px 0;border-radius:8px}
.big:active{filter:brightness(.92)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12.5px;padding:8px 13px;border:1px solid var(--line2);border-radius:16px;color:var(--dim)}
.chip.on{color:var(--pump);border-color:var(--pump)}
.chip:active{background:var(--card)}

.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:9px;overflow:hidden}
.card.open{border-color:var(--line2)}
.chd{width:100%;text-align:left;padding:15px 16px;display:block}
.chd:active{background:var(--card2)}
.chd-r{display:flex;align-items:baseline;gap:9px}
.chd-n{font-size:16.5px;font-weight:600;letter-spacing:-.01em;flex:1}
.chd-t{font-size:15px;font-weight:500;color:var(--pump)}
.chd-m{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.cbody{display:none;border-top:1px solid var(--line)}
.card.open .cbody{display:block}
.card.tight .chd{padding:14px 16px}
.chd .car{font-size:11px;color:var(--dimmer);margin-left:2px}
.cfoot{display:flex;border-top:1px solid var(--line)}
.cfoot button{flex:1;padding:15px 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.cfoot button+button{border-left:1px solid var(--line)}
.cfoot button.go{color:var(--pump);font-weight:600}
.cfoot button:active{background:var(--card2)}

/* ── väljaren ── */
.topbar{display:flex;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line);flex:none}
.topbar h2{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0;flex:1}
.topbar button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.filt{padding:13px 18px;border-bottom:1px solid var(--line);flex:none;display:flex;flex-direction:column;gap:9px}
.ex{display:flex;align-items:flex-start;gap:13px;padding:13px 18px;border-bottom:1px solid var(--line)}
.ex:active{background:var(--card)}
.ex .pick{width:24px;height:24px;border-radius:6px;border:1px solid var(--line2);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:transparent}
.ex.sel .pick{background:var(--pump);border-color:var(--pump);color:#1A0E00}
.ex .txt{flex:1;min-width:0}
.ex .nm{font-size:14.5px;font-weight:500;line-height:1.3}
.ex .ds{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:3px}
.ex .meta{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);margin-top:5px}
.ex .cnt{font-size:12px;color:var(--dimmer);flex:none;margin-top:2px;min-width:26px;text-align:right}
.ex.sel .cnt{color:var(--dim)}
.selbar{border-top:1px solid var(--line2);background:var(--card);flex:none;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
.selbar .s{flex:1;font-size:12.5px;color:var(--dim);line-height:1.4}
.selbar .s b{color:var(--ink);font-weight:600}
.selbar button{background:var(--pump);color:#1A0E00;font-weight:600;font-size:13px;
  padding:13px 22px;border-radius:7px}
.selbar button[disabled]{opacity:.35}

/* ── uppställning ── */
.ord{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.ord .i{font-size:12px;color:var(--dimmer);width:17px;flex:none;font-weight:500}
.ord .t{flex:1;line-height:1.3}
.pz{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pump);margin-top:4px;font-weight:500}
.pz.same{color:var(--dimmer)}
.ord .tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex:none}
.ord .mv{font-size:16px;color:var(--dimmer);padding:0 4px;flex:none}
.dial{margin-bottom:17px}
.dial-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dial-v{font-size:15px;font-weight:600}
input[type=range]{-webkit-appearance:none;width:100%;height:20px;background:transparent;display:block}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--pump)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{padding:9px 14px;font-size:12.5px;color:var(--dim)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.rowflex{display:flex;align-items:center;gap:13px;margin-top:14px;flex-wrap:wrap}
.field{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:6px;
  padding:12px 14px;font-size:14px;outline:none;margin-bottom:10px}
textarea.field{resize:none;line-height:1.5}
select.field{-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 19px) 19px,calc(100% - 14px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.twin{display:flex;gap:9px;padding:0 18px 18px}
.twin button{flex:1;padding:16px 0;border-radius:8px;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.twin .a{background:var(--pump);color:#1A0E00}
.twin .b{border:1px solid var(--line2);color:var(--ink)}
.note{font-size:11.5px;color:var(--dimmer);line-height:1.55;margin-top:9px}

.disc{border-top:1px solid var(--line)}
.disc>button{width:100%;padding:15px 0;display:flex;justify-content:space-between;align-items:center}
.disc>button span:last-child{color:var(--dim);font-size:11px}
.disc .body{display:none;padding:2px 0 22px}
.disc.open .body{display:block}
.aff p{font-size:15px;line-height:1.66;color:var(--ink);margin:0 0 15px;display:flex;gap:13px}
.aff p:last-child{margin-bottom:0}
.aff p b{color:var(--dim);font-weight:500;font-size:11.5px;flex:none;padding-top:5px;width:11px}

/* ── kort (klockläge) ── */
.shHead{padding:24px 20px 16px;border-bottom:1px solid var(--line);flex:none}
.shHead h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.shHead .m{font-size:11.5px;color:var(--dim);margin-top:6px}
.shRow{display:flex;gap:16px;padding:15px 20px;align-items:flex-start;border-bottom:1px solid var(--line)}
.shRow .i{font-size:14px;color:var(--dimmer);width:18px;flex:none;font-weight:500;padding-top:4px}
.shRow .c{flex:1;min-width:0}
.shRow .t{font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.25;display:block}
.shRow .ds{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:5px;display:block}
.shRow .s{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--pump);flex:none;padding-top:6px}
.shFoot{border-top:1px solid var(--line);display:flex;flex:none}
.shFoot button{flex:1;padding:18px 0 calc(18px + env(safe-area-inset-bottom));
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-weight:600}

#ask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(5,12,34,.93);padding:28px;z-index:50}
#ask.on{display:flex}
.askBox{background:var(--card);border:1px solid var(--line2);border-radius:10px;width:100%;max-width:330px;overflow:hidden}
.askBox p{margin:0;padding:26px 22px;font-size:16px;line-height:1.5;text-align:center}
.askBox .r{display:flex;border-top:1px solid var(--line)}
.askBox .r button{flex:1;padding:16px 0;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.askBox .r button+button{border-left:1px solid var(--line);color:var(--pump);font-weight:600}

/* ── kör ── */
#run{position:relative}
#run.rest{--bg:#021D6B; --ink:#F2EEE9;
  --dim:rgba(242,238,233,.74); --dimmer:rgba(242,238,233,.5);
  --line:rgba(242,238,233,.16); --line2:rgba(242,238,233,.3); --card:rgba(242,238,233,.1)}
#run.roundrest{--bg:#FE8A24; --ink:#021D6B;
  --dim:rgba(2,29,107,.78); --dimmer:rgba(2,29,107,.52);
  --line:rgba(2,29,107,.18); --line2:rgba(2,29,107,.33); --card:rgba(2,29,107,.1); --pump:#021D6B}
.prog{height:3px;background:var(--line);flex:none}
.prog span{display:block;height:100%;width:0;background:var(--pump)}
.rtop{display:flex;justify-content:space-between;padding:16px 18px 0}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;min-height:0}
.ph{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);height:16px;margin-bottom:14px;font-weight:600}
#run.work .ph{color:var(--pump)}
.exn{font-size:clamp(29px,8.6vw,48px);font-weight:600;letter-spacing:-.02em;line-height:1.08;
  text-align:center;margin:0;max-width:14ch;min-height:2.16em;display:flex;align-items:center;justify-content:center}
.sd{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);height:16px;margin-top:6px;font-weight:500}
.clk{font-size:clamp(72px,25vw,132px);font-weight:300;line-height:1;letter-spacing:-.04em;margin:12px 0 0}
#run.work .clk{color:var(--pump)}
.upnext{margin-top:18px;text-align:center;height:40px}
.upnext .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer);height:12px}
.upnext .v{font-size:14px;color:var(--dim);margin-top:5px;font-weight:500;height:19px;overflow:hidden}
.nxi{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer);margin-top:8px;height:14px}
.cue{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:#FE8A24;color:#021D6B;font-size:11vw;font-weight:600;letter-spacing:-.02em}
.cue.on{display:flex}
.strip{display:flex;gap:2px;padding:0 18px;height:14px;align-items:center;flex:none}
.strip i{flex:1;height:2px;background:var(--line2);border-radius:1px;transition:height .15s,background .15s}
.strip i.done{background:var(--dim)}
.strip i.now{background:var(--pump);height:8px}
.strip .brk{flex:0 0 1px;background:var(--dimmer);height:8px}
.rfoot{display:flex;border-top:1px solid var(--line);margin-top:14px}
.rfoot button{flex:1;padding:17px 0 calc(17px + env(safe-area-inset-bottom));font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-left:1px solid var(--line)}
.rfoot button:first-child{border-left:none;color:var(--ink);font-weight:600}

/* ── meditation ── */
html.medmode,body.medmode{background:#000}
#med{background:#000;color:#fff;align-items:center;justify-content:center;position:relative}
.medwrap{position:relative;width:min(70vw,290px);height:min(70vw,290px);display:flex;align-items:center;justify-content:center}
.medwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.medwrap circle{fill:none;stroke-width:.9}
.mtrack{stroke:rgba(255,255,255,.13)}
.mfill{stroke:rgba(255,255,255,.88);stroke-linecap:butt}
.medNum{font-size:66px;font-weight:200;color:#fff;letter-spacing:-.04em;line-height:1}
.medHint{position:absolute;bottom:14%;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.26);transition:opacity 1.6s ease;opacity:1}
.medHint.gone{opacity:0}

#done{align-items:center;justify-content:center;text-align:center;padding:32px}
#done h2{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}
#done .m{font-size:13px;color:var(--dim);line-height:1.8;margin:0 0 30px}
.wide{border:1px solid var(--line2);border-radius:6px;padding:14px 26px;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:9px;min-width:240px;display:block;color:var(--dim)}
.wide.p{color:var(--pump);border-color:var(--pump)}
.hint{font-size:11.5px;color:var(--dimmer);line-height:1.6;max-width:280px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ═══ HEM ═══ -->
<section id="home" class="screen on">
  <div class="mast">
    <h1 id="title">Jag &amp; Kroppen</h1>
    <div class="sport"><span>Surf · Klättring · Drag</span></div>
  </div>
  <div class="week" id="week"></div>
  <div class="scroll"><div class="pad">

    <div class="sec"><button class="big" id="bNew">Bygg dagens pass</button></div>

    <div class="sec" id="secLast" style="display:none">
      <span class="lbl">Senast</span>
      <div id="lastCard"></div>
    </div>

    <div class="sec">
      <span class="lbl">Sparade pass</span>
      <div id="savedList"></div>
    </div>

    <div class="sec">
      <span class="lbl">Tillägg</span>
      <div id="extras"></div>
    </div>

    <div class="disc aff" id="aff">
      <button><span class="lbl">Affirmationer</span><span>▾</span></button>
      <div class="body" id="affBody"></div>
    </div>

    <div class="disc" id="dAdd">
      <button><span class="lbl">Lägg till övning</span><span>▾</span></button>
      <div class="body">
        <input class="field" id="nxName" placeholder="Namn" maxlength="46">
        <textarea class="field" id="nxDesc" rows="2" placeholder="Kort beskrivning — hur den utförs" maxlength="150"></textarea>
        <select class="field" id="nxCat"></select>
        <select class="field" id="nxSide">
          <option value="">Tvåsidig — ingen sidväxling</option>
          <option value="split">Halva tiden per sida</option>
          <option value="alt">Full tid per sida, växlar per varv</option>
        </select>
        <div class="chips" id="nxEq"></div>
        <button class="big" id="nxSave" style="margin-top:14px">Spara övning</button>
        <div class="note" id="nxMsg"></div>
      </div>
    </div>

    <div class="disc" id="dSet">
      <button><span class="lbl">Inställningar</span><span>▾</span></button>
      <div class="body">
        <div class="lbl" style="margin-bottom:7px">Rubrik</div>
        <input class="field" id="titleIn" maxlength="34" placeholder="Jag &amp; Kroppen">
        <div class="rowflex"><span class="lbl">Röst</span>
          <div class="seg" id="vSeg"><button data-v="en" class="on">EN</button><button data-v="sv">SV</button><button data-v="off">Av</button></div></div>
        <div class="rowflex"><span class="lbl">Ljud</span>
          <div class="seg" id="aSeg"><button data-a="music" class="on">Med musik</button><button data-a="solo">Ensamt</button></div></div>
        <div class="note" id="aNote"></div>
      </div>
    </div>

  </div></div>
</section>

<!-- ═══ VÄLJ ÖVNINGAR ═══ -->
<section id="pick" class="screen">
  <div class="topbar"><h2>Välj övningar</h2><button id="pickBack">Avbryt</button></div>
  <div class="filt">
    <div class="chips" id="catChips"></div>
    <div class="chips" id="eqChips"></div>
  </div>
  <div class="scroll" id="exList"></div>
  <div class="selbar">
    <div class="s" id="selInfo">Inga valda</div>
    <button id="toSetup" disabled>Fortsätt</button>
  </div>
</section>

<!-- ═══ UPPSTÄLLNING ═══ -->
<section id="setup" class="screen">
  <div class="topbar"><h2>Dagens pass</h2>
    <button id="bSort">Sortera om</button><button id="setupBack">Tillbaka</button></div>
  <div class="scroll">
    <div id="ordList"></div>
    <div class="pad">
      <div class="dial"><div class="dial-t"><span class="lbl">Kör</span><span class="dial-v" id="wV">30 s</span></div>
        <input type="range" id="wR" min="10" max="90" step="5" value="30"></div>
      <div class="dial"><div class="dial-t"><span class="lbl">Paus</span><span class="dial-v" id="rV">15 s</span></div>
        <input type="range" id="rR" min="0" max="60" step="5" value="15"></div>
      <div class="dial"><div class="dial-t"><span class="lbl">Paus mellan varv</span><span class="dial-v" id="rrV">60 s</span></div>
        <input type="range" id="rrR" min="0" max="180" step="15" value="60"></div>
      <div class="rowflex"><span class="lbl">Varv</span>
        <div class="seg" id="rSeg">
          <button data-r="1">1</button><button data-r="2" class="on">2</button>
          <button data-r="3">3</button><button data-r="4">4</button></div></div>
      <div class="note" id="sumNote" style="margin-top:18px"></div>
      <input class="field" id="saveName" placeholder="Spara som pass — namn" maxlength="34" style="margin-top:18px">
      <button class="wide" id="bSavePass" style="min-width:0;width:100%">Spara passet</button>
    </div>
  </div>
  <div class="twin">
    <button class="b" id="bCard">Visa kort</button>
    <button class="a" id="bStart">Starta timer</button>
  </div>
</section>

<!-- ═══ KORT ═══ -->
<section id="sheet" class="screen">
  <div class="shHead"><h2 id="shTitle"></h2><div class="m" id="shMeta"></div></div>
  <div class="scroll" id="shBody"></div>
  <div class="shFoot"><button id="shClose">Stäng</button></div>
</section>

<!-- ═══ KÖR ═══ -->
<section id="run" class="screen">
  <div class="prog"><span id="fill"></span></div>
  <div class="rtop"><span class="lbl" id="rPass"></span><span class="lbl" id="rRound"></span></div>
  <div class="stage">
    <div class="ph" id="ph"></div>
    <h2 class="exn" id="exN"></h2>

    const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  async set(k,o){try{const s=JSON.stringify(o);

};
function saveState(){
  const cut=Date.now()-800*864e5,keep={};
  Object.entries(days).forEach(([k,v])=>{if(new Date(k).getTime()>cut)keep[k]=v});
  days=keep;
  Store.set(KEY,{days,counts,custom,saved,last,
    voice:st.voice,audio:st.audio,title:st.title,med:st.med,
    work:st.work,rest:st.rest,roundRest:st.roundRest,rounds:st.rounds});
}
async function loadState(){
  let d=await Store.get(KEY);
  if(!d){ const o=await Store.get(OLD); if(o){d={days:o.days||{},voice:o.voice,audio:o.audio,title:o.title,med:o.med}} }

  days=d.days||{};counts=d.counts||{};custom=d.custom||{};saved=d.saved||[];last=d.last||null;

/* ════ LJUD ════ */
let ac=null;
function audioSession(){try{if('audioSession' in navigator)navigator.audioSession.type=st.audio==='music'?'ambient':'playback'}catch(e){}}
function audioNote(){
  $('aNote').textContent = st.audio==='music'
    ? 'Pipen läggs ovanpå musiken utan att sänka den. Kräver att ringläget är på — ljudlöst tystar appen.'
    : 'Appen hörs även med telefonen på ljudlöst, men pausar musik i andra appar.';
}
function unlock(){
  audioSession();
  if(ac){ac.state==='suspended'&&ac.resume();return}
  ac=new(window.AudioContext||window.webkitAudioContext)();
  const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);
}
function tone(f,d,g,type){
  if(!ac)return;
  const o=ac.createOscillator(),n=ac.createGain(),t=ac.currentTime;
  o.type=type||'triangle';o.frequency.value=f;
  n.gain.setValueAtTime(0,t);n.gain.linearRampToValueAtTime(g,t+.006);
  n.gain.setValueAtTime(g,t+d*.7);n.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
function bowl(){
  if(!ac)return;
  const play=()=>{const t=ac.currentTime;
    [[288,.50,0],[576,.24,.02],[864,.10,.05]].forEach(([f,g,d0])=>{
      const o=ac.createOscillator(),n=ac.createGain();
      o.type='sine';o.frequency.value=f;
      n.gain.setValueAtTime(0,t+d0);n.gain.linearRampToValueAtTime(g,t+d0+.08);
      n.gain.exponentialRampToValueAtTime(.0001,t+d0+3.4);
      o.connect(n);n.connect(ac.destination);o.start(t+d0);o.stop(t+d0+3.5)})};
  if(ac.state!=='running')ac.resume().then(play).catch(play); else play();
}
let medKeep=null;
function keepAlive(on){
  if(!ac)return;
  if(on){if(medKeep)return;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=40;g.gain.value=.00012;
    o.connect(g);g.connect(ac.destination);o.start();medKeep=o;
  } else if(medKeep){try{medKeep.stop()}catch(e){}medKeep=null}
}
const SND={tick:()=>tone(980,.09,.34),go:()=>tone(1320,.62,.40),rest:()=>tone(700,.55,.36),
  round:()=>{tone(440,.75,.38);setTimeout(()=>tone(330,.5,.32),260)},
  swap:()=>{tone(1180,.07,.36);setTimeout(()=>tone(1180,.07,.36),110)},
  end:()=>[0,190,380].forEach((d,i)=>setTimeout(()=>tone(660+i*260,.35,.36),d))};
function say(txt){
  if(st.voice==='off'||!window.speechSynthesis)return;
  try{const en=st.voice==='en',u=new SpeechSynthesisUtterance(txt);
    u.lang=en?'en-GB':'sv-SE';u.rate=1.02;
    const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(en?'en':'sv'));
    if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
const nameFor=n=>st.voice==='en'?spoken(n):n;

/* ════ WAKE LOCK ════ */

async function awake(on){try{if(on){if(!wl&&'wakeLock'in navigator)wl=await navigator.wakeLock.request('screen')}
  else if(wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{

/* ════ TID ════ */
const totalOf=(ex,o)=>ex.length?10+o.rounds*ex.length*(o.work+o.rest)-o.rest+(o.rounds-1)*(o.roundRest-o.rest):0;
const opts=()=>({work:st.work,rest:st.rest,roundRest:st.roundRest,rounds:st.rounds});

    syncDials();

function renderPick(){
  $('catChips').innerHTML=
    '<button class="chip'+(st.cat==='alla'?' on':'')+'" data-cat="alla">Alla</button>'+
    CATS.map(([k,l])=>'<button class="chip'+(st.cat===k?' on':'')+'" data-cat="'+k+'">'+l+'</button>').join('');
  $('eqChips').innerHTML=
    EQS.map(([k,l])=>'<button class="chip'+(st.eqHide.has(k)?'':' on')+'" data-eq="'+k+'">'+l+'</button>').join('')+
    '<button class="chip'+(st.sort==='least'?' on':'')+'" data-sort="1">Minst använda</button>';
  const all=ALL();
  let names=Object.keys(all).filter(n=>{
    const e=all[n];
    if(st.cat!=='alla'&&e.cat!==st.cat)return false;
    if((e.eq||[]).some(q=>st.eqHide.has(q)))return false;
    return true;
  });
  names.sort((a,b)=> st.sort==='least'
    ? (counts[a]||0)-(counts[b]||0) || a.localeCompare(b,'sv')
    : a.localeCompare(b,'sv'));
  $('exList').innerHTML=names.map(n=>{
    const e=all[n],i=sel.indexOf(n),c=counts[n]||0;
    const bits=[];
    if(e.side==='alt')bits.push('per sida');
    if(e.side==='split')bits.push('halva/halva');
    (e.eq||[]).forEach(q=>bits.push((EQS.find(x=>x[0]===q)||[,q])[1]));
    if(e.custom)bits.push('egen');
    return '<div class="ex'+(i>=0?' sel':'')+'" data-n="'+n.replace(/"/g,'&quot;')+'">'+
      '<span class="pick">'+(i>=0?i+1:'')+'</span>'+
      '<span class="txt"><span class="nm">'+n+'</span>'+
      (e.d?'<span class="ds">'+e.d+'</span>':'')+
      (bits.length?'<span class="meta">'+bits.join(' · ')+'</span>':'')+'</span>'+
      '<span class="cnt">'+(c?c+'×':'–')+'</span></div>';
  }).join('')||'<div class="pad" style="color:var(--dim)">Inga övningar matchar filtret.</div>';
  const t=totalOf(sel,opts());

/* ════ AUTOMATISK ORDNING ════
   Två mål som drar åt olika håll: hålla ihop övningar i samma kroppsposition
   (slippa resa sig och lägga sig om och om igen) och undvika två av samma
   muskelgrupp i rad. Muskelkrocken väger tyngst — ordningen får hellre kosta
   en förflyttning än att ge två bröstövningar på raken.                      */
const PI={hang:0,prone:1,supine:2,side:3,stand:4,wall:5,mixed:6};
const PCOST=[
/*          hang prone supine side stand wall mixed */
/* hang  */ [ 0,   8,    8,    8,   4,    6,   3 ],
/* prone */ [ 8,   0,    2,    2,   5,    5,   2 ],
/* supine*/ [ 8,   2,    0,    2,   5,    5,   3 ],
/* side  */ [ 8,   2,    2,    0,   5,    5,   3 ],
/* stand */ [ 4,   5,    5,    5,   0,    2,   2 ],
/* wall  */ [ 6,   5,    5,    5,   2,    0,   3 ],
/* mixed */ [ 3,   2,    3,    3,   2,    3,   0 ]
];
const CATPOS={drag:'hang',tryck:'prone',ben:'stand',bal:'supine',hel:'mixed'};
const CATMG ={drag:'pull',tryck:'push',ben:'legs',bal:'core',hel:'full'};
const posOf=n=>{const e=info(n);return e.p||CATPOS[e.cat]||'stand'};
const mgOf =n=>{const e=info(n);return e.m||CATMG[e.cat]||'core'};
function mgCost(a,b){
  if(a===b)return 40;
  const soft=(x,y)=>x==='full'&&(y==='push'||y==='legs');
  return (soft(a,b)||soft(b,a))?12:0;
}
const tcost=(a,b)=>PCOST[PI[posOf(a)]][PI[posOf(b)]]+mgCost(mgOf(a),mgOf(b));
const chainCost=a=>{let c=0;for(let i=1;i<a.length;i++)c+=tcost(a[i-1],a[i]);return c};
/* Girig kedja från varje möjlig startövning, sedan förbättring: en girig kedja
   målar in sig i hörnet mot slutet, så vi vänder segment och flyttar enskilda
   övningar så länge det sänker totalkostnaden. Vid lika kostnad behålls
   ordningen du valde i listan. */
function improve(a){
  let better=true;
  while(better){
    better=false;
    for(let i=0;i<a.length-1&&!better;i++)
      for(let j=i+1;j<a.length&&!better;j++){
        const t=a.slice();t.splice(i,j-i+1,...a.slice(i,j+1).reverse());
        if(chainCost(t)<chainCost(a)-1e-9){a=t;better=true}
      }
    for(let i=0;i<a.length&&!better;i++)
      for(let j=0;j<a.length&&!better;j++){
        if(i===j)continue;
        const t=a.slice(),[x]=t.splice(i,1);t.splice(j,0,x);
        if(chainCost(t)<chainCost(a)-1e-9){a=t;better=true}
      }
  }
  return a;
}
function sortSel(){
  if(sel.length<3)return;
  let best=null,bestC=Infinity;
  for(let s=0;s<sel.length;s++){
    const pool=sel.filter((_,i)=>i!==s),out=[sel[s]];
    while(pool.length){
      let bi=0,bc=Infinity;
      pool.forEach((n,i)=>{const x=tcost(out[out.length-1],n);if(x<bc){bc=x;bi=i}});
      out.push(pool.splice(bi,1)[0]);
    }
    const fin=improve(out),c=chainCost(fin);
    if(c<bestC){bestC=c;best=fin}
  }
  if(best)sel=best;
}
const POSLBL={hang:'Häng',prone:'Mage',supine:'Rygg',side:'Sida',stand:'Stående',wall:'Vid vägg',mixed:'Upp & ner'};

/* ════ TIMER ════ */
let seq=[],marks=[],total=0,t0=0,pacc=0,pat=null,running=false,paused=false,raf=null,
    lastStep=-1,lastW=-1,swapDone=false,tStart=null,curEx=[],curName='';
function build(ex,o){
  const s=[{type:'prep',dur:10}];
  for(let r=1;r<=o.rounds;r++)ex.forEach((n,i)=>{
    s.push({type:'work',dur:o.work,name:n,side:info(n).side||null,round:r,idx:i,
      next:i<ex.length-1?ex[i+1]:(r<o.rounds?ex[0]:null),nextIsRound:i===ex.length-1&&r<o.rounds});
    const lastEx=i===ex.length-1;
    if(lastEx&&r<o.rounds){if(o.roundRest>0)s.push({type:'roundrest',dur:o.roundRest,round:r,next:ex[0]})}
    else if(!lastEx&&o.rest>0)s.push({type:'rest',dur:o.rest,round:r,next:ex[i+1]});
  });
  return s;
}
function startRun(){
  unlock();
  const o=opts();curEx=sel.slice();curName=$('saveName').value.trim()||'Dagens pass';
  seq=build(curEx,o);marks=[];let a=0;seq.forEach(x=>{a+=x.dur;marks.push(a)});total=a;
  t0=performance.now();pacc=0;pat=null;tStart=new Date();
  running=true;paused=false;lastStep=-1;lastW=-1;$('bPause').textContent='Paus';
  $('rPass').textContent=curName;
  drawStrip(curEx.length,o.rounds);show('run');awake(true);frame();
}
const el=()=>((paused?pat:performance.now())-t0-pacc)/1000;
const at=e=>{for(let i=0;i<marks.length;i++)if(e<marks[i])return i;return -1};
function frame(){
  if(!running)return;
  const e=el(),i=at(e);if(i<0)return finish();
  const s=seq[i],from=marks[i]-s.dur,left=marks[i]-e;
  if(i!==lastStep){enter(s);lastStep=i;swapDone=false}
  const w=Math.ceil(left);
  if(w!==lastW){$('clk').textContent=mmss(left);
    if((s.type==='work'||s.type==='prep')&&w<=3&&w>0)SND.tick();lastW=w}
  if(s.type==='work'&&s.side==='split'&&!swapDone&&left<=s.dur/2){swapDone=true;SND.swap();
    $('cue').classList.add('on');setTimeout(()=>$('cue').classList.remove('on'),850)}
  $('fill').style.width=(((e-from)/s.dur)*100).toFixed(2)+'%';
  if(!paused)raf=requestAnimationFrame(frame);
}
const upnext=(k,v)=>{$('upK').textContent=k;$('upV').textContent=v||''};
function enter(s){
  $('run').className='screen on '+s.type;
  const R=st.rounds;
  if(s.type==='prep'){
    $('ph').textContent='Förbered';$('exN').textContent=curEx[0];$('sd').textContent='';
    upnext('Först ut','');$('nxi').textContent='';$('rRound').textContent='Varv 1/'+R;
    say((st.voice==='en'?'Get ready':'Gör dig redo')+'. '+nameFor(curEx[0]));
  }
  if(s.type==='work'){
    $('ph').textContent='Kör';$('exN').textContent=s.name;
    $('rRound').textContent='Varv '+s.round+'/'+R;
    $('sd').textContent=s.side==='alt'?(s.round%2?'Vänster sida':'Höger sida'):s.side==='split'?'Byte efter halva':'';
    upnext(s.next?(s.nextIsRound?'Efter vilan':'Nästa'):'Sista övningen',s.next||'');
    $('nxi').textContent=(s.idx+1)+' av '+curEx.length;
    mark(s.round,s.idx);SND.go();
  }
  if(s.type==='rest'){
    $('ph').textContent='Paus';$('exN').textContent=s.next;$('sd').textContent='';
    upnext('Nästa','');$('nxi').textContent='';
    SND.rest();setTimeout(()=>say(nameFor(s.next)),480);
  }
  if(s.type==='roundrest'){
    $('ph').textContent='Varv klart';$('exN').textContent='Paus';$('sd').textContent='';
    upnext('Startar varv '+(s.round+1)+' med',s.next);$('nxi').textContent='';
    SND.round();const en=st.voice==='en';
    setTimeout(()=>say((en?'Round':'Varv')+' '+s.round+' '+(en?'done':'klart')),620);
  }
}
function drawStrip(n,R){const e=$('strip');e.innerHTML='';
  for(let r=1;r<=R;r++){for(let i=0;i<n;i++){const b=document.createElement('i');b.dataset.k=r+'-'+i;e.appendChild(b)}
    if(r<R){const d=document.createElement('span');d.className='brk';e.appendChild(d)}}}
function mark(r,i){let hit=false;$('strip').querySelectorAll('i').forEach(b=>{
  if(b.dataset.k===r+'-'+i){b.className='now';hit=true}else b.className=hit?'':'done'})}
function togglePause(){if(!running)return;
  if(paused){pacc+=performance.now()-pat;pat=null;paused=false;$('bPause').textContent='Paus';awake(true);frame()}
  else{pat=performance.now();paused=true;$('bPause').textContent='Fortsätt';awake(false);cancelAnimationFrame(raf)}}
function skip(){if(!running)return;const e=el(),i=at(e);if(i<0)return finish();
  const j=(marks[i]-e)*1000;if(paused)pat-=j;else t0-=j;lastW=-1;frame()}
function stopRun(){running=false;paused=false;cancelAnimationFrame(raf);awake(false);
  window.speechSynthesis&&speechSynthesis.cancel();show('home')}
function logSession(ex,name){
  days[iso(new Date())]='✓';
  ex.forEach(n=>counts[n]=(counts[n]||0)+1);
  last={name:name||'Dagens pass',ex:ex.slice(),...opts()};
  saveState();renderHome();
}
function finish(){
  running=false;cancelAnimationFrame(raf);awake(false);SND.end();
  say(st.voice==='en'?'Workout complete. Nice work.':'Passet är klart.');
  lastLog={name:curName,ex:curEx.slice(),start:tStart,end:new Date(),o:opts()};
  logSession(curEx,curName);
  $('dMeta').innerHTML=curName+'<br>'+curEx.length+' övningar · '+st.rounds+' varv · '+
    st.work+'/'+st.rest+'<br>'+mmss(total);
  $('dHint').textContent='';show('done');
}

/* ════ MEDITATION ════ */
const ARC=2*Math.PI*88;
let medRunning=false,medT0=0,medRaf=null,medLastNum=-1;
function medMode(on){
  document.documentElement.classList.toggle('medmode',on);
  document.body.classList.toggle('medmode',on);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',on?'#000000':'#050C22');
}
function launchMed(){
  unlock();medMode(true);keepAlive(true);
  medT0=performance.now();medRunning=true;medLastNum=-1;
  $('medArc').style.strokeDasharray=ARC;$('medArc').style.strokeDashoffset=0;
  $('medNum').textContent=Math.round(st.med/60);
  $('medHint').classList.remove('gone');
  setTimeout(()=>$('medHint').classList.add('gone'),4500);
  show('med');awake(true);medFrame();
}
function medFrame(){
  if(!medRunning)return;
  const e=(performance.now()-medT0)/1000,left=st.med-e;
  if(left<=0)return endMed(true);
  $('medArc').style.strokeDashoffset=(ARC*(e/st.med)).toFixed(2);
  const n=Math.ceil(left/60);
  if(n!==medLastNum){$('medNum').textContent=n;medLastNum=n}
  medRaf=requestAnimationFrame(medFrame);
}
function endMed(complete){
  medRunning=false;cancelAnimationFrame(medRaf);awake(false);
  if(complete){$('medArc').style.strokeDashoffset=ARC;$('medNum').textContent='0';bowl();
    setTimeout(()=>{keepAlive(false);medMode(false);show('home')},2600);
  } else {keepAlive(false);medMode(false);show('home')}
}

const z=d=>d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'T'+p2(d.getUTCHours())+p2(d.getUTCMinutes())+p2(d.getUTCSeconds())+'Z';

$('shClose').onclick=()=>$('ask').classList.add('on');
$('askYes').onclick=()=>answerSheet(true);
$('askNo').onclick=()=>answerSheet(false);
$('bPause').onclick=togglePause;$('bSkip').onclick=skip;$('bStop').onclick=stopRun;
$('bHome').onclick=()=>show('home');$('bCal').onclick=toCal;
$('med').onclick=()=>{if(medRunning)endMed(false)};
$('nxEq').onclick=e=>{const q=e.target.dataset.neq;if(!q)return;
  newEq.has(q)?newEq.delete(q):newEq.add(q);e.target.classList.toggle('on',newEq.has(q))};
$('nxSave').onclick=()=>{
  const n=$('nxName').value.trim(),m=$('nxMsg');
  if(!n){m.textContent='Övningen behöver ett namn.';return}
  if(ALL()[n]){m.textContent='Det finns redan en övning med det namnet.';return}
  custom[n]={cat:$('nxCat').value,eq:[...newEq],side:$('nxSide').value||undefined,
    d:$('nxDesc').value.trim(),custom:true};
  saveState();
  $('nxName').value='';$('nxDesc').value='';newEq.clear();
  $('nxEq').querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
  m.textContent=n+' tillagd. Den dyker upp i listan när du bygger ett pass.';
};
document.querySelectorAll('.disc>button').forEach(b=>b.onclick=()=>{
  const d=b.parentElement;d.classList.toggle('open');
  b.querySelector('span:last-child').textContent=d.classList.contains('open')?'▴':'▾'});
$('titleIn').oninput=e=>{st.title=e.target.value.trim()||'Jag & Kroppen';
  $('title').textContent=st.title;document.title=st.title;saveState()};
$('vSeg').onclick=e=>{if(e.target.tagName!=='BUTTON')return;st.voice=e.target.dataset.v;
  $('vSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));
  saveState();if(st.voice!=='off')say(st.voice==='en'?'Voice on':'Rösten är på')};
$('aSeg').onclick=e=>{if(e.target.tagName!=='BUTTON')return;st.audio=e.target.dataset.a;
  $('aSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));
  audioSession();audioNote();saveState();unlock();SND.go()};
document.addEventListener('touchstart',unlock,{once:true});
document.addEventListener('click',unlock,{once:true});
applyTitle();audioNote();syncDials();renderHome();loadState();
</script>
</body>
</html>
